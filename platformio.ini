; PlatformIO Project Configuration File
;
; Fused Glass Lighting
; Seeed XIAO ESP32-C3, ESP-IDF framework.
;
;   seeed_xiao_esp32c3     Rev F prototype (LD1500SB modules, 1 kHz PWM on the CE pads). Unchanged.
;   seeed_xiao_esp32c3_g2  Rev G2 board (TPS61500 SEPIC, analog dimming on EN, string-voltage guards).
;
; https://docs.platformio.org/page/projectconf.html

[common]
platform = espressif32
board = seeed_xiao_esp32c3
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
build_flags =
    -Wall
    -Wextra
    -Wno-unused-parameter

[env:seeed_xiao_esp32c3]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
build_flags =
    ${common.build_flags}
    -DFGL_BOARD_REV_F

[env:seeed_xiao_esp32c3_g2]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
; Per-piece settings (see docs/g2_decisions.md, D4/D5):
;   FGL_MAX_CURRENT_MA   string current at full knob, clamped to the JP1 ceiling (244 / 488 mA)
;   FGL_STRING_VMIN_MV / FGL_STRING_VMAX_MV   optional fixed window for VOUT at the probe current;
;                        leave undefined to learn it on the first good start (stored in NVS)
build_flags =
    ${common.build_flags}
    -DFGL_BOARD_G2
    -DFGL_MAX_CURRENT_MA=150
